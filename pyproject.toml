[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kantun"
version = "0.0.1"
description = "Lightweight, model-agnostic hyperparameter tuning. Works standalone or alongside KANBoost."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Tuama M Hamzah"}
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
kanboost = ["kanboost"]

[project.urls]
Homepage = "https://github.com/tuamah/kantun"
